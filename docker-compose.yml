services:
  keeper-1:
    image: clickhouse/clickhouse-keeper:latest
    container_name: keeper-1
    hostname: keeper-1
    volumes:
      - keeper-1-data:/var/lib/clickhouse-keeper
      - ./configs/keeper/keeper-1.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    ports:
      - "9181:9181"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  keeper-2:
    image: clickhouse/clickhouse-keeper:latest
    container_name: keeper-2
    hostname: keeper-2
    volumes:
      - keeper-2-data:/var/lib/clickhouse-keeper
      - ./configs/keeper/keeper-2.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  keeper-3:
    image: clickhouse/clickhouse-keeper:latest
    container_name: keeper-3
    hostname: keeper-3
    volumes:
      - keeper-3-data:/var/lib/clickhouse-keeper
      - ./configs/keeper/keeper-3.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  clickhouse-1:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-1
    hostname: clickhouse-1
    depends_on:
      - keeper-1
      - keeper-2
      - keeper-3
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9363:9363"
    volumes:
      - ch-1-data:/var/lib/clickhouse
      - ch-1-logs:/var/log/clickhouse-server
      - ./configs/clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
      - ./configs/clickhouse/users.xml:/etc/clickhouse-server/users.d/custom.xml:ro
      - ./configs/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./configs/clickhouse/macros-node1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  clickhouse-2:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-2
    hostname: clickhouse-2
    depends_on:
      - keeper-1
      - keeper-2
      - keeper-3
    ports:
      - "8124:8123"
      - "9001:9000"
      - "9364:9363"
    volumes:
      - ch-2-data:/var/lib/clickhouse
      - ch-2-logs:/var/log/clickhouse-server
      - ./configs/clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
      - ./configs/clickhouse/users.xml:/etc/clickhouse-server/users.d/custom.xml:ro
      - ./configs/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./configs/clickhouse/macros-node2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  keeper-1-data:
  keeper-2-data:
  keeper-3-data:
  ch-1-data:
  ch-1-logs:
  ch-2-data:
  ch-2-logs:
